[project]
name = "kai-database-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.28,<2",
  "sqlglot>=28,<31",
  "PyMySQL[rsa]>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "dmPython==2.5.38; sys_platform == 'linux'",
  "uvicorn>=0.30,<1",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]
[project.scripts]
kai-database-mcp = "kai_database_mcp.server:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.pytest.ini_options]
asyncio_mode = "auto"
