[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-agent-harness"
version = "0.3.0"
description = "Production-shaped harness for Claude Agent SDK applications"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ag-ui-protocol>=0.1,<1",
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "claude-agent-sdk>=0.2.152,<0.3",
    "certifi>=2025.6",
    "cryptography>=45,<50",
    "daytona>=0.196,<1",
    "e2b>=2.33,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "httpcore>=1.0,<2",
    "mcp>=1.28,<2",
    "minio>=7.2,<8",
    "openpyxl>=3.1,<4",
    "opentelemetry-api>=1.34,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
    "opentelemetry-sdk>=1.34,<2",
    "pillow>=11,<13",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "PyJWT>=2.10,<3",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "pyyaml>=6.0,<7",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
    "libarchive-c>=5.3,<6",
    "pgvector>=0.4,<0.6",
]

[project.scripts]
harness = "harness.cli:entrypoint"
harness-worker = "harness.worker.main:entrypoint"
harness-quality-worker = "harness.quality.main:entrypoint"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
