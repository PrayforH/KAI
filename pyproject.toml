[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-agent-harness"
version = "0.3.0"
description = "Production-shaped harness for Claude Agent SDK applications"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ag-ui-protocol>=0.1,<1",
    "alembic>=1.16,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "claude-agent-sdk>=0.2.152,<0.3",
    "certifi>=2025.6",
    "cryptography>=45,<50",
    "daytona>=0.196,<1",
    "e2b>=2.33,<3",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "httpcore>=1.0,<2",
    "mcp>=1.28,<2",
    "minio>=7.2,<8",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0,<3",
    "opentelemetry-api>=1.34,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.34,<2",
    "opentelemetry-sdk>=1.34,<2",
    "packaging>=24,<27",
    "pillow>=11,<13",
    "pydantic-settings>=2.10,<3",
    "pypdf>=6,<7",
    "PyJWT>=2.10,<3",
    "python-docx>=1.2,<2",
    "python-pptx>=1.0,<2",
    "pyyaml>=6.0,<7",
    "redis>=6.2,<7",
    "sqlalchemy[asyncio]>=2.0.41,<3",
    "uvicorn[standard]>=0.35,<1",
    "websockets>=15,<17",
    "libarchive-c>=5.3,<6",
    "pgvector>=0.4,<0.5",
]

[project.optional-dependencies]
# The DeepAgents runtime is an opt-in execution kernel, not a platform
# dependency: without this extra the platform still runs on Claude Agent SDK and
# Codex. `HARNESS_RUNTIME=multi` is what actually needs it, and `build_deepagents_runtime`
# refuses to compose a multi-runtime deployment without it. The API image installs
# it (see deploy/docker/api.Dockerfile) because it is also the Worker image, and
# the Worker is the process that executes a DeepAgents Run.
deepagents = [
    # Pinned: the export renderer and the runtime read the same plan, so a
    # version bump must re-run both contract suites together.
    "deepagents==0.7.13",
    # deepagents 0.7.13 ships langchain-anthropic and langchain-google-genai but
    # not langchain-openai, which the openai_compatible route branch needs.
    "langchain-openai>=1.0,<2.0",
    # Streamable HTTP MCP registrations, loaded as LangChain tools. The export
    # renderer pins the same range, so an exported project and the platform
    # runtime speak to an MCP server the same way.
    "langchain-mcp-adapters>=0.3,<0.4",
    # No checkpointer package: session continuity stays with the platform, which
    # replays the session's durable history into each Run. Binding a LangGraph
    # thread would switch that replay off (see runtime/deepagents_events.py).
]

[project.scripts]
harness = "harness.cli:entrypoint"
harness-worker = "harness.worker.main:entrypoint"
harness-quality-worker = "harness.quality.main:entrypoint"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
