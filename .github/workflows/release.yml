name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer already declared by Python, Web, Helm and CHANGELOG
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/verify.yml

  build-once:
    needs: quality
    runs-on: ${{ vars.HARNESS_RELEASE_RUNNER || 'ubuntu-latest' }}
    env:
      KUBECTL_IMAGE: cgr.dev/chainguard/kubectl@sha256:1e1aa9dedf0d9008e5a3710b23f2072bc2ab83117146d503c689b5d2592add3d
      RELEASE_REGISTRY: ${{ vars.HARNESS_RELEASE_REGISTRY || 'ghcr.io' }}
      RELEASE_NAMESPACE: ${{ vars.HARNESS_RELEASE_NAMESPACE || github.repository }}
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      artifact-name: release-${{ github.sha }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Bind the Git ref to one repository platform version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == v* ]] || { echo "release tag must start with v" >&2; exit 1; }
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ -n "$version" && "$version" != "$tag_version" ]]; then
              echo "workflow version $version does not match tag $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="$tag_version"
          fi
          test -n "$version"
          uv run python scripts/check_release_version.py \
            --expected "$version" --require-released
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.RELEASE_REGISTRY }}
          username: ${{ secrets.HARNESS_RELEASE_REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.HARNESS_RELEASE_REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the immutable kubectl source image
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$KUBECTL_IMAGE" >/dev/null
      - name: Derive lowercase immutable image references
        run: |
          set -euo pipefail
          prefix="$RELEASE_REGISTRY/$RELEASE_NAMESPACE"
          echo "IMAGE_PREFIX=${prefix,,}" >> "$GITHUB_ENV"
      - name: Build and push API once
        id: api
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/api.Dockerfile
          push: true
          pull: true
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          build-args: |
            KUBECTL_IMAGE=${{ env.KUBECTL_IMAGE }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build and push Web once
        id: web
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          push: true
          pull: true
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Build and push Sandbox once
        id: sandbox
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/sandbox.Dockerfile
          push: true
          pull: true
          tags: ${{ env.IMAGE_PREFIX }}/sandbox:${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=sandbox
          cache-to: type=gha,scope=sandbox,mode=max
      - name: Pack byte-deterministic Agent bundles
        run: |
          make agent-determinism
          mkdir -p dist/release/sbom dist/release/vex
          cp security/vex/cryptography-49.0.0.openvex.json dist/release/vex/
          uv run python scripts/check_agent_packages.py --output dist/release/agents
          uv run python scripts/release_notes.py \
            --version "$RELEASE_VERSION" \
            --output dist/release/RELEASE_NOTES.md
      - name: Generate API SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/api@${{ steps.api.outputs.digest }}
          format: spdx-json
          output-file: dist/release/sbom/api.spdx.json
          upload-artifact: false
      - name: Generate Web SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/web@${{ steps.web.outputs.digest }}
          format: spdx-json
          output-file: dist/release/sbom/web.spdx.json
          upload-artifact: false
      - name: Generate Sandbox SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE_PREFIX }}/sandbox@${{ steps.sandbox.outputs.digest }}
          format: spdx-json
          output-file: dist/release/sbom/sandbox.spdx.json
          upload-artifact: false
      - name: Scan exact release digests
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.2
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github.com/aquasecurity/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$TRIVY_IMAGE" >/dev/null
          for image in \
            "$IMAGE_PREFIX/api@$API_DIGEST" \
            "$IMAGE_PREFIX/web@$WEB_DIGEST" \
            "$IMAGE_PREFIX/sandbox@$SANDBOX_DIGEST"; do
            docker run --rm \
              -v "$HOME/.docker:/root/.docker:ro" \
              -v "$PWD:/workspace:ro" \
              "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
              --vex /workspace/security/vex/cryptography-49.0.0.openvex.json \
              --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
      - name: Create deterministic release manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          uv run python scripts/release_manifest.py create \
            --artifact-root dist/release \
            --platform-version "$RELEASE_VERSION" \
            --release-notes "$PWD/dist/release/RELEASE_NOTES.md" \
            --source-commit "$SOURCE_COMMIT" \
            --image "api=$IMAGE_PREFIX/api@$API_DIGEST" \
            --image "web=$IMAGE_PREFIX/web@$WEB_DIGEST" \
            --image "sandbox=$IMAGE_PREFIX/sandbox@$SANDBOX_DIGEST" \
            --sbom "api=$PWD/dist/release/sbom/api.spdx.json" \
            --sbom "web=$PWD/dist/release/sbom/web.spdx.json" \
            --sbom "sandbox=$PWD/dist/release/sbom/sandbox.spdx.json" \
            --output dist/release/release-manifest.json
      - name: Keyless-sign images, SBOM attestations, and release manifest
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          set -euo pipefail
          for component in api web sandbox; do
            digest_variable="${component^^}_DIGEST"
            image="$IMAGE_PREFIX/$component@${!digest_variable}"
            cosign sign --yes "$image"
            cosign attest --yes --type spdxjson \
              --predicate "dist/release/sbom/$component.spdx.json" "$image"
            # Keep a detached signature bundle for the exact SBOM bytes in
            # addition to the image-bound attestation. Promotion verifies
            # both attachment identity and byte equality with the manifest.
            cosign sign-blob --yes \
              --bundle "dist/release/sbom/$component.sigstore.json" \
              "dist/release/sbom/$component.spdx.json"
          done
          cosign attest --yes --type openvex \
            --predicate dist/release/vex/cryptography-49.0.0.openvex.json \
            "$IMAGE_PREFIX/api@$API_DIGEST"
          cosign sign-blob --yes \
            --bundle dist/release/vex/cryptography-49.0.0.sigstore.json \
            dist/release/vex/cryptography-49.0.0.openvex.json
          cosign sign-blob --yes \
            --bundle dist/release/release-manifest.sigstore.json \
            dist/release/release-manifest.json
          mkdir -p dist/release/_release-assets
          evidence="dist/release/_release-assets/agent-studio-$RELEASE_VERSION-evidence.tar.gz"
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          tar --sort=name --mtime="@$source_date_epoch" \
            --owner=0 --group=0 --numeric-owner \
            --exclude='./_release-assets' -C dist/release -cf - . \
            | gzip -n -9 >"$evidence"
          evidence_dir="$(dirname "$evidence")"
          evidence_name="$(basename "$evidence")"
          (cd "$evidence_dir" && sha256sum "$evidence_name" >"$evidence_name.sha256")
          cosign sign-blob --yes \
            --bundle "$evidence.sigstore.json" \
            "$evidence"
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.sha }}
          path: dist/release
          if-no-files-found: error
          retention-days: 90

  publish-draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-once
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ github.sha }}
          path: dist/release
      - name: Create a draft GitHub Release only after signing succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          evidence="dist/release/_release-assets/agent-studio-$version-evidence.tar.gz"
          test -f "$evidence" && test -f "$evidence.sha256" \
            && test -f "$evidence.sigstore.json"
          gh release create "$GITHUB_REF_NAME" \
            "$evidence" "$evidence.sha256" "$evidence.sigstore.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft \
            --title "Agent Studio $GITHUB_REF_NAME" \
            --notes-file dist/release/RELEASE_NOTES.md
