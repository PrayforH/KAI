name: verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Quota admission tests (test_run_api.py) require enforcement enabled.
      HARNESS_QUOTA_ENFORCEMENT_ENABLED: "true"
      # Storage integration tests restart engines against a dedicated test DB.
      HARNESS_TEST_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5432/harness_test
    services:
      postgres:
        # Memory v2 migrations run `CREATE EXTENSION vector`; CI needs the
        # pgvector-enabled Postgres build (same 0.8.6/PG18 line as production).
        image: pgvector/pgvector:0.8.6-pg18
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:8.10.1-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Verify DeepAgents with its optional runtime installed
        run: |
          uv run --frozen --extra deepagents pytest -q \
            tests/unit/runtime/test_deepagents_*.py \
            tests/unit/runtime/test_registry_deepagents_runtime.py \
            tests/integration/runtime/test_deepagents_graph.py
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version: "1.24.2"
          cache: false
      - name: Build and start MinIO test service
        env:
          # Upstream RELEASE.2025-04-22T22-12-26Z. Its published images and
          # archived binaries are no longer publicly downloadable.
          MINIO_SOURCE_COMMIT: 0d7408fc9969caf07de6a8c3a84f9fbb10a6739e
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/minio-source"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/minio/minio.git
          git -C "$source_dir" fetch --depth=1 origin "$MINIO_SOURCE_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$MINIO_SOURCE_COMMIT"
          (cd "$source_dir" && CGO_ENABLED=0 go build -o "$RUNNER_TEMP/minio" .)
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9000 >"$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat "$RUNNER_TEMP/minio.log"
              exit 1
            fi
            sleep 1
          done
          uv run --frozen python - <<'PY'
          from minio import Minio

          client = Minio("127.0.0.1:9000", access_key="minioadmin",
                         secret_key="minioadmin", secure=False)
          if not client.bucket_exists("harness-artifacts"):
              client.make_bucket("harness-artifacts")
          PY
      - name: Verify single migration head and reversible latest revision
        run: |
          set -euo pipefail
          test "$(uv run alembic heads | grep -c '(head)')" = "1"
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          # Storage integration tests deliberately restart engines; keep their
          # database independent from the migration/e2e database.
          uv run python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://harness:harness@localhost:5432/harness"
              )
              try:
                  await connection.execute("CREATE DATABASE harness_test")
              except asyncpg.exceptions.DuplicateDatabaseError:
                  pass
              await connection.close()


          asyncio.run(main())
          PY
      - name: Lint, type, package determinism, and full Python suite
        run: make verify
      - name: Retain the full type diagnostic report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pyright-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/quality/pyright.json
          if-no-files-found: ignore
      - name: Deterministic runtime smoke and Eval/deployment gates
        run: |
          uv run python scripts/e2e_fake_runtime.py
          uv run pytest -q \
            tests/unit/evals \
            tests/unit/deployments/test_lifecycle.py \
            tests/integration/api/test_agent_studio_api.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/harness-console
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/harness-console/package-lock.json
          registry-url: https://registry.npmmirror.com
      - name: Match the production builder npm version
        run: npm install --global npm@11.6.2 --registry=https://registry.npmmirror.com
      - run: npm ci --registry=https://registry.npmmirror.com
      - run: npm test
      - run: npm run build

  container-security:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the immutable kubectl source image
        env:
          KUBECTL_IMAGE: cgr.dev/chainguard/kubectl@sha256:333192bc8c507f58823da957aaadcfec438062fd9ae2ac80dde84bac0d5e5a8c
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$KUBECTL_IMAGE" >/dev/null
      - name: Build the three production images without pushing
        env:
          KUBECTL_IMAGE: cgr.dev/chainguard/kubectl@sha256:333192bc8c507f58823da957aaadcfec438062fd9ae2ac80dde84bac0d5e5a8c
        run: |
          set -euo pipefail
          docker build --pull --build-arg KUBECTL_IMAGE="$KUBECTL_IMAGE" \
            -f deploy/docker/api.Dockerfile -t harness-api:ci .
          docker build --pull -f deploy/docker/web.Dockerfile -t harness-web:ci .
          docker build --pull -f deploy/docker/sandbox.Dockerfile -t harness-sandbox:ci .
      - name: Verify the scanner and block HIGH/CRITICAL vulnerabilities
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.2
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github.com/aquasecurity/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$TRIVY_IMAGE" >/dev/null
          scan_status=0
          for image in harness-api:ci harness-web:ci harness-sandbox:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workspace:ro" \
              -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
              "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
              --vex /workspace/security/vex/cryptography-49.0.0.openvex.json \
              --severity HIGH,CRITICAL --exit-code 1 "$image" || scan_status=1
          done
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            -v "$RUNNER_TEMP/trivy-cache:/root/.cache/trivy" \
            "$TRIVY_IMAGE" fs --scanners secret,misconfig \
            --ignorefile /workspace/.trivyignore.yaml \
            --severity HIGH,CRITICAL --exit-code 1 . || scan_status=1
          exit "$scan_status"
