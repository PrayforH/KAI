name: verify

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Quota admission tests (test_run_api.py) require enforcement enabled.
      HARNESS_QUOTA_ENFORCEMENT_ENABLED: "true"
      # Storage integration tests restart engines against a dedicated test DB.
      HARNESS_TEST_DATABASE_URL: postgresql+asyncpg://harness:harness@localhost:5432/harness_test
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness
          POSTGRES_DB: harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7.4.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.28"
          enable-cache: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --group dev
        env:
          UV_DEFAULT_INDEX: https://pypi.tuna.tsinghua.edu.cn/simple
      - name: Start MinIO test service
        run: |
          docker run -d --name harness-test-minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:RELEASE.2025-04-22T22-12-26Z \
            server /data
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker logs harness-test-minio
              exit 1
            fi
            sleep 1
          done
          docker run --rm --network host --entrypoint /bin/sh \
            minio/mc:RELEASE.2025-04-16T18-13-26Z \
            -c 'mc alias set local http://127.0.0.1:9000 minioadmin minioadmin && mc mb --ignore-existing local/harness-artifacts'
      - name: Verify single migration head and reversible latest revision
        run: |
          set -euo pipefail
          test "$(uv run alembic heads | grep -c '(head)')" = "1"
          uv run alembic upgrade head
          uv run alembic downgrade -1
          uv run alembic upgrade head
          # Storage integration tests deliberately restart engines; keep their
          # database independent from the migration/e2e database.
          uv run python - <<'PY'
          import asyncio

          import asyncpg


          async def main() -> None:
              connection = await asyncpg.connect(
                  "postgresql://harness:harness@localhost:5432/harness"
              )
              try:
                  await connection.execute("CREATE DATABASE harness_test")
              except asyncpg.exceptions.DuplicateDatabaseError:
                  pass
              await connection.close()


          asyncio.run(main())
          PY
      - name: Lint, type, package determinism, and full Python suite
        run: make verify
      - name: Deterministic runtime smoke and Eval/deployment gates
        run: |
          uv run python scripts/e2e_fake_runtime.py
          uv run pytest -q \
            tests/unit/evals \
            tests/unit/deployments/test_lifecycle.py \
            tests/integration/api/test_agent_studio_api.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/harness-console
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/harness-console/package-lock.json
          registry-url: https://registry.npmmirror.com
      - run: npm ci --registry=https://registry.npmmirror.com
      - run: npm test
      - run: npm run build

  container-security:
    needs: [backend, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify the immutable kubectl source image
        env:
          KUBECTL_IMAGE: cgr.dev/chainguard/kubectl@sha256:1e1aa9dedf0d9008e5a3710b23f2072bc2ab83117146d503c689b5d2592add3d
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity=https://github.com/chainguard-images/images/.github/workflows/release.yaml@refs/heads/main \
            "$KUBECTL_IMAGE" >/dev/null
      - name: Build the three production images without pushing
        env:
          KUBECTL_IMAGE: cgr.dev/chainguard/kubectl@sha256:1e1aa9dedf0d9008e5a3710b23f2072bc2ab83117146d503c689b5d2592add3d
        run: |
          set -euo pipefail
          docker build --pull --build-arg KUBECTL_IMAGE="$KUBECTL_IMAGE" \
            -f deploy/docker/api.Dockerfile -t harness-api:ci .
          docker build --pull -f deploy/docker/web.Dockerfile -t harness-web:ci .
          docker build --pull -f deploy/docker/sandbox.Dockerfile -t harness-sandbox:ci .
      - name: Verify the scanner and block HIGH/CRITICAL vulnerabilities
        env:
          TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.69.2
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity-regexp '^https://github.com/aquasecurity/' \
            --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
            "$TRIVY_IMAGE" >/dev/null
          for image in harness-api:ci harness-web:ci harness-sandbox:ci; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD:/workspace:ro" \
              "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
              --vex /workspace/security/vex/cryptography-49.0.0.openvex.json \
              --severity HIGH,CRITICAL --exit-code 1 "$image"
          done
          docker run --rm -v "$PWD:/workspace" -w /workspace \
            "$TRIVY_IMAGE" fs --scanners secret,misconfig \
            --severity HIGH,CRITICAL --exit-code 1 .
