<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚餐分账便签</title>
<style>
  :root{
    --paper:#fbf7e4;
    --line:#cfd8e8;
    --margin:#e08a8a;
    --ink:#1f3a68;
    --ink-soft:#4a6690;
    --pin:#d94f4f;
    --wood:#6b4a34;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px;
    background:
      radial-gradient(circle at 20% 15%, #3b2c22 0%, #2a1f18 45%, #1c1410 100%);
    font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC","PingFang SC",serif;
    -webkit-font-smoothing:antialiased;
  }
  .pad{
    position:relative;
    width:100%;
    max-width:560px;
    background:var(--paper);
    border-radius:6px 10px 10px 6px;
    box-shadow:
      0 1px 0 #e9e2c6,
      0 18px 40px rgba(0,0,0,.55),
      inset 0 0 60px rgba(202,178,120,.18);
    padding:26px 26px 22px 74px;
    overflow:hidden;
  }
  /* 纸张横线 */
  .pad::before{
    content:"";
    position:absolute;
    inset:0 0 0 0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 33px,
      var(--line) 33px,
      var(--line) 34px
    );
    opacity:.55;
    pointer-events:none;
  }
  /* 左侧红边线 */
  .margin-line{
    position:absolute;
    top:0;bottom:0;left:60px;
    width:2px;
    background:var(--margin);
    opacity:.75;
  }
  /* 装订孔 */
  .holes{
    position:absolute;
    top:0;bottom:0;left:16px;
    width:26px;
    display:flex;
    flex-direction:column;
    justify-content:space-around;
    padding:26px 0;
  }
  .hole{
    width:20px;height:20px;
    border-radius:50%;
    background:#241a13;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.35);
    margin:0 auto;
  }
  .content{position:relative;z-index:2;}

  h1{
    font-size:27px;
    color:var(--ink);
    margin:0 0 2px;
    letter-spacing:2px;
    font-weight:700;
  }
  .sub{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:0 0 18px;
    letter-spacing:.5px;
  }

  .dish{
    padding:9px 0 5px;
    border-bottom:1px dashed rgba(120,140,175,.45);
  }
  .dish-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
  }
  .dish-name{
    font-size:19px;
    color:var(--ink);
    font-weight:700;
  }
  .dish-price{
    font-family:"Courier New",monospace;
    font-size:17px;
    color:var(--ink-soft);
  }
  .names{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin:8px 0 2px;
  }
  .chip{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13px;
    padding:3px 11px;
    border-radius:999px;
    border:1.5px solid rgba(90,115,155,.5);
    color:var(--ink-soft);
    background:transparent;
    cursor:pointer;
    user-select:none;
    transition:.15s;
  }
  .chip:hover{border-color:var(--margin);color:var(--margin);}
  .chip.on{
    background:var(--ink);
    border-color:var(--ink);
    color:#fbf7e4;
  }

  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:20px 0 6px;
    font-size:19px;
    color:var(--ink);
    font-weight:700;
  }
  .total-row .amt{font-family:"Courier New",monospace;font-size:22px;}

  .result-title{
    font-size:14px;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink-soft);
    letter-spacing:1px;
    margin:14px 0 8px;
  }
  .person{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:7px 4px;
    border-bottom:1px solid rgba(150,165,195,.35);
  }
  .p-name{font-size:18px;color:var(--ink);}
  .p-detail{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:11.5px;
    color:#8a97ad;
    display:block;
    margin-top:1px;
  }
  .p-amt{
    font-family:"Courier New",monospace;
    font-size:20px;
    color:var(--pin);
    font-weight:700;
  }
  .person.owed .p-name{color:var(--pin);}
  .person.owed .p-amt{color:#2f7d4f;}

  .btns{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
  }
  button.act{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:13.5px;
    padding:8px 16px;
    border-radius:8px;
    border:1.5px solid var(--ink);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:.15s;
  }
  button.act:hover{background:var(--ink);color:var(--paper);}
  .note{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:11.5px;
    color:#9aa6b8;
    margin-top:12px;
    line-height:1.6;
  }
  .err{color:var(--pin);}
</style>
</head>
<body>
<div class="pad">
  <div class="holes">
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div><div class="hole"></div>
    <div class="hole"></div><div class="hole"></div>
  </div>
  <div class="margin-line"></div>
  <div class="content">
    <h1>聚餐分账便签</h1>
    <p class="sub">勾选每道菜由谁吃，费用按人头平分 · 5 人聚餐</p>

    <div id="dishes"></div>

    <div class="total-row">
      <span>合计</span>
      <span class="amt" id="grandTotal">¥0.00</span>
    </div>

    <div class="result-title">各人应付</div>
    <div id="people"></div>

    <div class="btns">
      <button class="act" id="resetAll">全部平摊</button>
      <button class="act" id="toggleAll">全选该菜人头</button>
    </div>

    <div class="note" id="note">
      提示：某道菜若只有部分人吃，勾选对应的人即可，费用会在他们之间平分；
      按分（0.01 元）计算，除不尽的余数会依次分给名单靠前的人，保证各人相加等于合计。
    </div>
  </div>
</div>

<script>
(function(){
  var PEOPLE = ["小王","小李","小张","小赵","小陈"];
  var DISHES = [
    {name:"披萨", price:3000},
    {name:"意面", price:2000},
    {name:"沙拉", price:1000}
  ];

  // sel[d] = array of person indices sharing dish d (default: everyone)
  var sel = DISHES.map(function(){ return PEOPLE.map(function(_,i){return i;}); });

  function fmt(cents){
    return "¥" + (cents/100).toFixed(2);
  }

  // split total cents across n people, remainder to the first r (deterministic)
  function alloc(total, group){
    var n = group.length;
    var per = Math.floor(total / n);
    var rem = total - per * n;
    var out = {};
    group.forEach(function(pi, idx){
      out[pi] = per + (idx < rem ? 1 : 0);
    });
    return out;
  }

  function render(){
    var dishWrap = document.getElementById("dishes");
    dishWrap.innerHTML = "";
    DISHES.forEach(function(dish, d){
      var box = document.createElement("div");
      box.className = "dish";

      var head = document.createElement("div");
      head.className = "dish-head";
      head.innerHTML =
        '<span class="dish-name">' + dish.name + '</span>' +
        '<span class="dish-price">' + fmt(dish.price) + '</span>';
      box.appendChild(head);

      var names = document.createElement("div");
      names.className = "names";
      PEOPLE.forEach(function(p, i){
        var chip = document.createElement("span");
        chip.className = "chip" + (sel[d].indexOf(i) !== -1 ? " on" : "");
        chip.textContent = p;
        chip.onclick = function(){
          var pos = sel[d].indexOf(i);
          if(pos === -1){ sel[d].push(i); }
          else { sel[d].splice(pos,1); }
          render();
          save();
        };
        names.appendChild(chip);
      });
      box.appendChild(names);
      dishWrap.appendChild(box);
    });

    // grand total
    var grand = DISHES.reduce(function(s,d){ return s + d.price; }, 0);
    document.getElementById("grandTotal").textContent = fmt(grand);

    // per-person
    var owed = PEOPLE.map(function(){ return 0; });
    var details = PEOPLE.map(function(){ return []; });
    var hasEmpty = false;

    DISHES.forEach(function(dish, d){
      if(sel[d].length === 0){ hasEmpty = true; return; }
      var share = alloc(dish.price, sel[d]);
      Object.keys(share).forEach(function(pi){
        owed[pi] += share[pi];
        details[pi].push(dish.name + fmt(share[pi]));
      });
    });

    var pplWrap = document.getElementById("people");
    pplWrap.innerHTML = "";
    PEOPLE.forEach(function(p, i){
      var row = document.createElement("div");
      row.className = "person";
      row.innerHTML =
        '<div><span class="p-name">' + p + '</span>' +
        '<span class="p-detail">' + (details[i].join(" + ") || "未参与") + '</span></div>' +
        '<span class="p-amt">' + fmt(owed[i]) + '</span>';
      pplWrap.appendChild(row);
    });

    var note = document.getElementById("note");
    if(hasEmpty){
      note.innerHTML = '<span class="err">有菜品的勾选为空，该菜费用无法分摊，请至少选一人。</span>';
    } else {
      note.innerHTML =
        '提示：某道菜若只有部分人吃，勾选对应的人即可，费用会在他们之间平分；' +
        '按分（0.01 元）计算，除不尽的余数会依次分给名单靠前的人，保证各人相加等于合计。';
    }
  }

  // toggleAll: if every dish has all 5 -> they're "均摊"; button cycles select-all
  document.getElementById("resetAll").onclick = function(){
    sel = DISHES.map(function(){ return PEOPLE.map(function(_,i){return i;}); });
    render(); save();
  };

  document.getElementById("toggleAll").onclick = function(){
    // if all dishes currently full, keep full (no-op signal); otherwise fill empty/short ones
    sel = DISHES.map(function(){ return PEOPLE.map(function(_,i){return i;}); });
    render(); save();
  };

  // ---- frame state channel ----
  var token = null;
  try{ token = new URLSearchParams(location.hash.slice(1)).get("harness_ui_token"); }catch(e){}

  function save(){
    if(!token) return;
    try{
      window.parent.postMessage({type:"harness.ui.state", token:token, state:{sel:sel}}, "*");
    }catch(e){}
  }

  function restore(state){
    if(state && Array.isArray(state.sel) && state.sel.length === DISHES.length){
      var ok = state.sel.every(function(g){
        return Array.isArray(g) && g.every(function(x){ return x>=0 && x<PEOPLE.length; });
      });
      if(ok){ sel = state.sel; }
    }
    render();
  }

  window.addEventListener("message", function(ev){
    if(ev.source !== window.parent) return;
    var data = ev.data;
    if(!data || data.type !== "harness.ui.init") return;
    if(token && data.token !== token) return;
    if(!token && data.token) token = data.token;
    restore(data.state);
  });

  render();
  if(token){
    try{ window.parent.postMessage({type:"harness.ui.ready", token:token}, "*"); }catch(e){}
  }
})();
</script>
</body>
</html>
