apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: public-opinion-agent
  version: 0.3.22
  labels:
    domain: public-opinion
    template: orchestrator
    display-name: 涉非舆情分析（Codex）
    description: Codex 0.3.22：明确“涉非”仅指涉及非法集资，禁止误扩展为非洲；延续快速首动作、深度报告与主体化文件命名。
    codex-reasoning-effort: low
    evaluation-enabled: "true"
spec:
  runtime: codex-app-server
  model:
    route: codex-deepseek-v4-flash
    model: deepseek-v4-flash-vision-exp
    requiredCapabilities: [streaming, tool_use]
  prompt:
    system: prompts/system.md
  skills:
    - skills/public-opinion-analysis
  tools:
    - builtin: Read
    - builtin: Glob
    - builtin: Grep
    - builtin: Write
    - builtin: Edit
    - builtin: Bash
    - builtin: Task
    - mcp: sentiment_query_mcp
  toolExposureMode: eager
  knowledgeReferences: []
  subagents:
    - ref: helper-agent@1.0.0
      alias: fact-researcher
      description: 只读核验工作区材料中的关键事实，整理原始来源、时间线、转载关系和证据缺口。
      background: true
    - ref: helper-agent@1.0.0
      alias: audience-analyst
      description: 只读分析工作区材料中的公众观点、争议焦点和情绪表达，不推断总体比例。
      background: true
    - ref: helper-agent@1.0.0
      alias: industry-analyst
      description: 只读分析工作区材料中的行业背景、利益相关者与传播节点。
      background: true
  hooks: []
  permissions:
    policy: production-orchestrator
  workspace:
    mode: isolated
    restoreSession: true
    archiveOnComplete: true
  limits:
    maxTurns: 128
    maxToolCalls: 512
    timeoutSeconds: 7200
    maxBudgetUsd: 4
    maxModelTokens: 400000
    maxSubagents: 8
    maxSubagentTasks: 16
    maxConcurrentSubagents: 4
    maxSubagentDepth: 1
    maxSubagentUsageUnits: 300000
