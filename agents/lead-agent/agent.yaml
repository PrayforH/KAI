apiVersion: harness/v1alpha1
kind: Agent
metadata:
  name: lead-agent
  version: 1.0.2
  labels:
    domain: general-assistant
    template: orchestrator
    display-name: 通用 Lead Agent
    description: 面向所有用户的通用任务入口，负责澄清目标、规划、执行、验证与交付。
    visibility: user-default
spec:
  runtime: claude-agent-sdk
  model:
    route: deepseek-v4-pro
    model: deepseek-v4-pro
    requiredCapabilities:
    - streaming
    - tool_use
  prompt:
    system: prompts/system.md
  skills:
  - skills/general-task-orchestration
  - skills/evidence-reporting
  - skills/research-synthesis
  - skills/delivery-verification
  - skills/document-spreadsheet-production
  - skills/skill-authoring-quality
  - skills/skill-creator
  tools:
  - builtin: Read
  - builtin: Glob
  - builtin: Grep
  - builtin: Write
  - builtin: Edit
  - builtin: Bash
  - builtin: WebSearch
  - builtin: WebFetch
  subagents: []
  hooks: []
  permissions:
    policy: production-orchestrator
  workspace:
    mode: isolated
    restoreSession: true
    archiveOnComplete: true
  limits:
    maxTurns: 80
    timeoutSeconds: 3600
    maxBudgetUsd: 20
    maxModelTokens: 1000000
