# Harbor image overlay.
#
# Example (amd64, immutable release tag):
#   HARNESS_IMAGE_ARCH=amd64 HARNESS_HARBOR_IMAGE_TAG=<git-sha> \
#   docker compose \
#     --env-file deploy/docker-compose/.env.docker \
#     -p claude-agent-harness \
#     -f deploy/docker-compose/compose.yaml \
#     -f deploy/docker-compose/compose.harbor.yaml \
#     --profile observability \
#     pull
#
#   HARNESS_IMAGE_ARCH=amd64 HARNESS_HARBOR_IMAGE_TAG=<git-sha> \
#   docker compose \
#     --env-file deploy/docker-compose/.env.docker \
#     -p claude-agent-harness \
#     -f deploy/docker-compose/compose.yaml \
#     -f deploy/docker-compose/compose.harbor.yaml \
#     --profile observability \
#     up -d --no-build --wait

x-harbor-image: &harbor-image
  pull_policy: always

services:
  postgres:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_DEPENDENCY_PROJECT:-dependencies-ai}/postgres:${HARNESS_HARBOR_POSTGRES_TAG:-18.1}

  redis:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_DEPENDENCY_PROJECT:-dependencies-ai}/redis:${HARNESS_HARBOR_REDIS_TAG:-7.0-alpine}

  minio:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_DEPENDENCY_PROJECT:-dependencies-ai}/minio/minio:${HARNESS_HARBOR_MINIO_TAG:-RELEASE.2025-04-22T22-12-26Z}

  # The MinIO server image also contains /usr/bin/mc, so the init job does
  # not need the separate Docker Hub minio/mc image.
  minio-init:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_DEPENDENCY_PROJECT:-dependencies-ai}/minio/minio:${HARNESS_HARBOR_MINIO_TAG:-RELEASE.2025-04-22T22-12-26Z}

  migrate:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-api:${HARNESS_HARBOR_IMAGE_TAG:-develop}

  api:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-api:${HARNESS_HARBOR_IMAGE_TAG:-develop}
    build: null

  worker:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-api:${HARNESS_HARBOR_IMAGE_TAG:-develop}

  quality-sync:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-api:${HARNESS_HARBOR_IMAGE_TAG:-develop}

  seed:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-api:${HARNESS_HARBOR_IMAGE_TAG:-develop}

  web:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-web:${HARNESS_HARBOR_IMAGE_TAG:-develop}
    build: null

  otel-collector:
    <<: *harbor-image
    image: ${HARNESS_HARBOR_REGISTRY:-harbor.shdata.com:5000}/${HARNESS_HARBOR_PROJECT:-agent-studio}/${HARNESS_IMAGE_ARCH:-amd64}/agent-studio-otel-collector:${HARNESS_HARBOR_IMAGE_TAG:-develop}
