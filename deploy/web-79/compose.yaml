name: kai-web-79
services:
  postgres:
    image: postgres:18.1
    environment:
      POSTGRES_DB: harness
      POSTGRES_USER: harness
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U harness -d harness
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
    - postgres18-cluster-data:/var/lib/postgresql
    restart: unless-stopped
  redis:
    image: redis:8.4.0
    command:
    - redis-server
    - --appendonly
    - 'yes'
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
    - redis-data:/data
    restart: unless-stopped
  minio:
    image: harbor.shdata.com:5000/dependencies-ai/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
    - minio-data:/data
    restart: unless-stopped
  migrate:
    image: kai/axis-api:20260908-web79
    entrypoint: []
    command:
    - alembic
    - upgrade
    - head
    environment:
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD:?set
        POSTGRES_PASSWORD}@postgres:5432/harness
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'
  api:
    image: kai/axis-api:20260908-web79
    environment:
      HARNESS_ENVIRONMENT: production
      HARNESS_RUNTIME: ${HARNESS_RUNTIME:-claude-sdk}
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD:?set
        POSTGRES_PASSWORD}@postgres:5432/harness
      HARNESS_REDIS_URL: redis://redis:6379/0
      HARNESS_MINIO_ENDPOINT: minio:9000
      HARNESS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      HARNESS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      HARNESS_MINIO_BUCKET: harness-artifacts
      HARNESS_MINIO_SECURE: 'false'
      HARNESS_AUTH_JWT_SECRET: ${HARNESS_AUTH_JWT_SECRET:?set HARNESS_AUTH_JWT_SECRET}
      HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET: ${HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET:?set
        HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET}
      HARNESS_AUTH_ISSUER: ${HARNESS_AUTH_ISSUER:-claude-agent-harness}
      HARNESS_AUTH_AUDIENCE: ${HARNESS_AUTH_AUDIENCE:-claude-agent-harness-api}
      HARNESS_AUTH_ACCESS_TOKEN_MINUTES: ${HARNESS_AUTH_ACCESS_TOKEN_MINUTES:-30}
      HARNESS_AUTH_REFRESH_TOKEN_DAYS: ${HARNESS_AUTH_REFRESH_TOKEN_DAYS:-30}
      HARNESS_AUTH_ALLOW_REGISTRATION: ${HARNESS_AUTH_ALLOW_REGISTRATION:-true}
      HARNESS_AUTH_DEFAULT_TENANT_ID: ${HARNESS_AUTH_DEFAULT_TENANT_ID:-local}
      HARNESS_AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      HARNESS_AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      HARNESS_AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      HARNESS_AUTH_GITHUB_CLIENT_SECRET: ${AUTH_GITHUB_CLIENT_SECRET:-}
      HARNESS_QUOTA_ENFORCEMENT_ENABLED: ${HARNESS_QUOTA_ENFORCEMENT_ENABLED:-false}
      HARNESS_MCP_DISCOVERY_PROXY_URL: ${HARNESS_MCP_DISCOVERY_PROXY_URL:-}
      HARNESS_OTEL_ENABLED: ${HARNESS_OTEL_ENABLED:-false}
      HARNESS_OTEL_CONTENT_CAPTURE: ${HARNESS_OTEL_CONTENT_CAPTURE:-off}
      HARNESS_OTEL_CONTENT_MAX_CHARS: ${HARNESS_OTEL_CONTENT_MAX_CHARS:-12000}
      HARNESS_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      HARNESS_OTEL_SERVICE_NAME: claude-agent-harness
      HARNESS_OTEL_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      HARNESS_API_BEARER_TOKEN: ${HARNESS_API_BEARER_TOKEN:?set HARNESS_API_BEARER_TOKEN}
      HARNESS_SANDBOX_PROVIDER: local
      HARNESS_ALLOW_UNSAFE_LOCAL_SANDBOX: 'true'
      HARNESS_SANDBOX_EXECUTION_MODE: remote_cli
      HARNESS_KNOWLEDGE_MCP_PUBLIC_URL: http://api:8000/mcp/knowledge
      HARNESS_MEMORY_MCP_PUBLIC_URL: http://api:8000/mcp/memory
    ports:
    - 127.0.0.1:8800:8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    env_file:
    - model.env
    - network.env
  worker:
    image: kai/axis-api:20260908-web79
    entrypoint:
    - entrypoint-worker
    deploy:
      replicas: ${HARNESS_WORKER_REPLICAS:-1}
    environment:
      HARNESS_ENVIRONMENT: production
      HARNESS_RUNTIME: ${HARNESS_RUNTIME:-claude-sdk}
      HARNESS_CODEX_CLI_PATH: ${HARNESS_CODEX_CLI_PATH:-/usr/local/bin/codex}
      HARNESS_CODEX_MODEL_BY_ROUTE: ${HARNESS_CODEX_MODEL_BY_ROUTE:-{}}
      HARNESS_CODEX_PROVIDER_BY_ROUTE: ${HARNESS_CODEX_PROVIDER_BY_ROUTE:-{}}
      HARNESS_CODEX_APPROVAL_POLICY: ${HARNESS_CODEX_APPROVAL_POLICY:-untrusted}
      HARNESS_CODEX_NETWORK_ACCESS: ${HARNESS_CODEX_NETWORK_ACCESS:-false}
      HARNESS_CODEX_TOOL_OUTPUT_TOKEN_LIMIT: ${HARNESS_CODEX_TOOL_OUTPUT_TOKEN_LIMIT:-32000}
      HARNESS_AUTH_JWT_SECRET: ${HARNESS_AUTH_JWT_SECRET:?set HARNESS_AUTH_JWT_SECRET}
      HARNESS_DATABASE_URL: postgresql+asyncpg://harness:${POSTGRES_PASSWORD:?set
        POSTGRES_PASSWORD}@postgres:5432/harness
      HARNESS_REDIS_URL: redis://redis:6379/0
      HARNESS_MINIO_ENDPOINT: minio:9000
      HARNESS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      HARNESS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      HARNESS_MINIO_BUCKET: harness-artifacts
      HARNESS_MINIO_SECURE: 'false'
      HARNESS_SANDBOX_PROVIDER: local
      HARNESS_SANDBOX_EXECUTION_MODE: remote_cli
      HARNESS_ALLOW_UNSAFE_LOCAL_SANDBOX: 'true'
      HARNESS_DAYTONA_API_KEY: ${HARNESS_DAYTONA_API_KEY:-}
      HARNESS_DAYTONA_API_URL: ${HARNESS_DAYTONA_API_URL:-https://app.daytona.io/api}
      HARNESS_DAYTONA_TARGET: ${HARNESS_DAYTONA_TARGET:-}
      HARNESS_DAYTONA_SNAPSHOT: ${HARNESS_DAYTONA_SNAPSHOT:-}
      HARNESS_DAYTONA_REMOTE_WORKSPACE_ROOT: ${HARNESS_DAYTONA_REMOTE_WORKSPACE_ROOT:-/home/daytona/harness}
      HARNESS_DAYTONA_CLAUDE_CLI_VERSION: ${HARNESS_DAYTONA_CLAUDE_CLI_VERSION:-2.1.206}
      HARNESS_DAYTONA_CLAUDE_CLI_PATH: ${HARNESS_DAYTONA_CLAUDE_CLI_PATH:-/home/daytona/.local/bin/claude}
      HARNESS_DAYTONA_DELETE_ON_DESTROY: ${HARNESS_DAYTONA_DELETE_ON_DESTROY:-true}
      HARNESS_DAYTONA_AUTO_STOP_INTERVAL_MINUTES: ${HARNESS_DAYTONA_AUTO_STOP_INTERVAL_MINUTES:-15}
      HARNESS_DAYTONA_AUTO_DELETE_INTERVAL_MINUTES: ${HARNESS_DAYTONA_AUTO_DELETE_INTERVAL_MINUTES:-60}
      HARNESS_DAYTONA_SESSION_REUSE_ENABLED: ${HARNESS_DAYTONA_SESSION_REUSE_ENABLED:-true}
      HARNESS_DAYTONA_SESSION_IDLE_TIMEOUT_SECONDS: ${HARNESS_DAYTONA_SESSION_IDLE_TIMEOUT_SECONDS:-600}
      HARNESS_DAYTONA_WARM_POOL_MAX_SESSIONS: ${HARNESS_DAYTONA_WARM_POOL_MAX_SESSIONS:-3}
      HARNESS_DAYTONA_RECOVERY_RETENTION_SECONDS: ${HARNESS_DAYTONA_RECOVERY_RETENTION_SECONDS:-3600}
      HARNESS_E2B_API_KEY: ${HARNESS_E2B_API_KEY:-}
      HARNESS_E2B_TEMPLATE: ${HARNESS_E2B_TEMPLATE:-base}
      HARNESS_E2B_TIMEOUT_SECONDS: ${HARNESS_E2B_TIMEOUT_SECONDS:-3600}
      HARNESS_E2B_REMOTE_WORKSPACE_ROOT: ${HARNESS_E2B_REMOTE_WORKSPACE_ROOT:-/home/user/harness}
      HARNESS_E2B_CLAUDE_CLI_VERSION: ${HARNESS_E2B_CLAUDE_CLI_VERSION:-2.1.206}
      HARNESS_E2B_CLAUDE_CLI_PATH: ${HARNESS_E2B_CLAUDE_CLI_PATH:-/home/user/.local/bin/claude}
      HARNESS_E2B_ALLOW_INTERNET_ACCESS: ${HARNESS_E2B_ALLOW_INTERNET_ACCESS:-true}
      HARNESS_KUBERNETES_NAMESPACE: ${HARNESS_KUBERNETES_NAMESPACE:-harness-sandboxes}
      HARNESS_KUBERNETES_IMAGE: ${HARNESS_KUBERNETES_IMAGE:-}
      HARNESS_KUBERNETES_RUNTIME_CLASS_NAME: ${HARNESS_KUBERNETES_RUNTIME_CLASS_NAME:-gvisor}
      HARNESS_KUBERNETES_SERVICE_ACCOUNT_NAME: ${HARNESS_KUBERNETES_SERVICE_ACCOUNT_NAME:-harness-sandbox}
      HARNESS_KUBERNETES_KUBECTL_PATH: ${HARNESS_KUBERNETES_KUBECTL_PATH:-kubectl}
      HARNESS_KUBERNETES_KUBECONFIG: ${HARNESS_KUBERNETES_KUBECONFIG:-}
      HARNESS_KUBERNETES_CONTEXT: ${HARNESS_KUBERNETES_CONTEXT:-}
      HARNESS_KUBERNETES_EGRESS_PROXY_URL: ${HARNESS_KUBERNETES_EGRESS_PROXY_URL:-}
      HARNESS_KUBERNETES_EGRESS_GATEWAY_NAMESPACE: ${HARNESS_KUBERNETES_EGRESS_GATEWAY_NAMESPACE:-harness-system}
      HARNESS_KUBERNETES_EGRESS_GATEWAY_PORT: ${HARNESS_KUBERNETES_EGRESS_GATEWAY_PORT:-3128}
      HARNESS_KUBERNETES_EGRESS_GATEWAY_SELECTOR_JSON: ${HARNESS_KUBERNETES_EGRESS_GATEWAY_SELECTOR_JSON:-{"app.kubernetes.io/name":"harness-egress-proxy"}}
      HARNESS_KUBERNETES_POD_TTL_SECONDS: ${HARNESS_KUBERNETES_POD_TTL_SECONDS:-3600}
      HARNESS_KUBERNETES_REAPER_INTERVAL_SECONDS: ${HARNESS_KUBERNETES_REAPER_INTERVAL_SECONDS:-30}
      HARNESS_WORKER_TASK_VISIBILITY_TIMEOUT_SECONDS: ${HARNESS_WORKER_TASK_VISIBILITY_TIMEOUT_SECONDS:-60}
      HARNESS_WORKER_TASK_RETRY_DELAY_SECONDS: ${HARNESS_WORKER_TASK_RETRY_DELAY_SECONDS:-1}
      HARNESS_WORKER_TASK_HEARTBEAT_SECONDS: ${HARNESS_WORKER_TASK_HEARTBEAT_SECONDS:-20}
      HARNESS_WORKER_CONCURRENCY: ${HARNESS_WORKER_CONCURRENCY:-4}
      HARNESS_WORKER_DEFERRED_MAX_ACTIVE_RUNS: ${HARNESS_WORKER_DEFERRED_MAX_ACTIVE_RUNS:-2}
      HARNESS_RUN_RESERVATION_TTL_SECONDS: ${HARNESS_RUN_RESERVATION_TTL_SECONDS:-86400}
      HARNESS_QUOTA_ENFORCEMENT_ENABLED: ${HARNESS_QUOTA_ENFORCEMENT_ENABLED:-false}
      HARNESS_WORKER_METRICS_PORT: ${HARNESS_WORKER_METRICS_PORT:-8001}
      HARNESS_RELIABILITY_REAPER_INTERVAL_SECONDS: ${HARNESS_RELIABILITY_REAPER_INTERVAL_SECONDS:-30}
      HARNESS_STUCK_QUEUED_SECONDS: ${HARNESS_STUCK_QUEUED_SECONDS:-120}
      HARNESS_STUCK_PROVISIONING_SECONDS: ${HARNESS_STUCK_PROVISIONING_SECONDS:-300}
      HARNESS_STUCK_RUNNING_SECONDS: ${HARNESS_STUCK_RUNNING_SECONDS:-3600}
      HARNESS_STUCK_WAITING_APPROVAL_SECONDS: ${HARNESS_STUCK_WAITING_APPROVAL_SECONDS:-900}
      HARNESS_STUCK_CANCELLING_SECONDS: ${HARNESS_STUCK_CANCELLING_SECONDS:-30}
      HARNESS_PREFLIGHT_TIMEOUT_SECONDS: ${HARNESS_PREFLIGHT_TIMEOUT_SECONDS:-180}
      HARNESS_WORKSPACE_ARCHIVE_MAX_BYTES: ${HARNESS_WORKSPACE_ARCHIVE_MAX_BYTES:-536870912}
      HARNESS_WORKSPACE_ARCHIVE_MAX_MEMBERS: ${HARNESS_WORKSPACE_ARCHIVE_MAX_MEMBERS:-10000}
      HARNESS_MCP_SECRET_REFERENCES_JSON: ${HARNESS_MCP_SECRET_REFERENCES_JSON:-{}}
      HARNESS_MCP_SERVER_SECRETS_JSON: ${HARNESS_MCP_SERVER_SECRETS_JSON:-{}}
      HARNESS_OTEL_ENABLED: ${HARNESS_OTEL_ENABLED:-false}
      HARNESS_OTEL_CONTENT_CAPTURE: ${HARNESS_OTEL_CONTENT_CAPTURE:-off}
      HARNESS_OTEL_CONTENT_MAX_CHARS: ${HARNESS_OTEL_CONTENT_MAX_CHARS:-12000}
      HARNESS_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      HARNESS_OTEL_SERVICE_NAME: claude-agent-harness
      HARNESS_OTEL_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET: ${HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET:?set
        HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET}
      HARNESS_MEMORY_MCP_PUBLIC_URL: http://api:8000/mcp/memory
      HARNESS_KNOWLEDGE_WORKLOAD_TOKEN_SECRET: ${HARNESS_KNOWLEDGE_WORKLOAD_TOKEN_SECRET:-${HARNESS_MEMORY_WORKLOAD_TOKEN_SECRET}}
      HARNESS_KNOWLEDGE_MCP_PUBLIC_URL: http://api:8000/mcp/knowledge
    expose:
    - ${HARNESS_WORKER_METRICS_PORT:-8001}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - from pathlib import Path; raise SystemExit('harness-worker' not in Path('/proc/1/cmdline').read_text())
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6
    restart: unless-stopped
    env_file:
    - model.env
    - network.env
  seed:
    image: kai/axis-api:20260908-web79
    entrypoint: []
    command:
    - python
    - scripts/seed_docker.py
    environment:
      HARNESS_API_URL: http://api:8000
      HARNESS_API_BEARER_TOKEN: ${HARNESS_API_BEARER_TOKEN:?set HARNESS_API_BEARER_TOKEN}
      HARNESS_TENANT_ID: ${HARNESS_TENANT_ID:-local}
      HARNESS_USER_ID: ${HARNESS_USER_ID:-system}
      HARNESS_SEED_AGENT_MANIFESTS: /app/agents/lead-agent/agent.yaml
      HARNESS_SEED_STUDIO_MANIFESTS: ''
      HARNESS_SEED_OPTIONAL_STUDIO_MANIFESTS: ''
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'
  web:
    image: kai/axis-web:20260908-web79
    environment:
      HARNESS_API_URL: http://api:8000
      HARNESS_PUBLIC_API_URL: ${HARNESS_PUBLIC_API_URL:-}
      HARNESS_API_PUBLIC_PORT: ${HARNESS_API_PORT:-8000}
      HARNESS_API_BEARER_TOKEN: ${HARNESS_API_BEARER_TOKEN:?set HARNESS_API_BEARER_TOKEN}
      HARNESS_AGENT_NAME: ${HARNESS_AGENT_NAME:-lead-agent}
      HARNESS_AGENT_VERSION: 1.0.1
      AUTH_PUBLIC_URL: http://172.20.105.79:3501
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_REFRESH_COOKIE_DAYS: ${HARNESS_AUTH_REFRESH_TOKEN_DAYS:-30}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GITHUB_CLIENT_ID: ${AUTH_GITHUB_CLIENT_ID:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
      HARNESS_OTEL_ENABLED: ${HARNESS_OTEL_ENABLED:-false}
      HARNESS_OTEL_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
      COPILOTKIT_TELEMETRY_DISABLED: 'true'
    ports:
    - 3501:3000
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data: null
  postgres18-cluster-data: null
  redis-data: null
  minio-data: null
