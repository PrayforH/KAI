# Host-network Nginx container; upstream is the main KAI Web on 174:3501.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name 172.20.109.174;
    return 308 https://172.20.109.174$request_uri;
}
server {
    listen 443 ssl;
    server_name 172.20.109.174;
    ssl_certificate /etc/nginx/tls/kai-174.crt;
    ssl_certificate_key /etc/nginx/tls/kai-174.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    location / {
        proxy_pass http://127.0.0.1:3501;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
